name: CI

# Runs exactly what an agent runs before finishing: `task setup` then `task gate`.

on:
  push:
    branches: [main]
    paths-ignore:
      - log/**
      - ROADMAP.md
      - docs/product/**
      - AGENTS.md
      - CLAUDE.md
  pull_request:
    # The jobs skip drafts; ready_for_review runs them when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - log/**
      - ROADMAP.md
      - docs/product/**
      - AGENTS.md
      - CLAUDE.md

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Opening a pull request as a draft starts no runner.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # `task gate` runs `claude plugin validate --strict` and fails in CI without it.
      - name: Install the claude CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.287
      - name: Setup
        run: task setup
      - name: Gate
        run: task gate

  # The shim resolves and spawns emo differently per OS; run its tests natively.
  shim:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup
        run: task setup
      - name: Shim tests
        run: task test:shim
